name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.7.17'
      - run: uv sync --frozen --group dev
      - run: uv run python scripts/fetch_ocr_models.py
      - run: uv run pytest -q
      - run: uv run python scripts/eta_integration.py
      - run: uv run python scripts/quality_integration.py
      - run: uv run python scripts/layout_integration.py
      - run: uv run python scripts/audit_public.py
      - if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/build.ps1
      - if: github.event_name == 'workflow_dispatch'
        run: uv run python scripts/collect_notices.py
      - if: github.event_name == 'workflow_dispatch'
        run: uv run python scripts/package_public.py
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-public-alpha
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
