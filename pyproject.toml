[project]
name = "papertranslator-windows"
version = "0.5.10a1"
license = "AGPL-3.0-only"
readme = "README.md"
description = "Local Windows academic PDF translation workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8,<6.11",
    "PyMuPDF>=1.25,<1.27",
    "httpx>=0.28,<0.29",
    "psutil>=7,<8",
    "rapidocr-onnxruntime==1.4.4",
    "onnxruntime>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
 "pyinstaller>=6,<7",
 "pypdf>=5,<7",
 "pillow>=11,<13",
 "gguf>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertranslator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
